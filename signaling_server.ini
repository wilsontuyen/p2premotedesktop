; Cấu hình Signaling & Relay Server
; host: địa chỉ IP hoặc domain để lắng nghe (0.0.0.0 = tất cả interface)
; port: cổng lắng nghe

[server]
host = 0.0.0.0
port = 8765

[Log]
; Chế độ ghi log (all):
;   all = 0 : Tắt toàn bộ log (không hiện màn hình, không ghi ra file)
;   all = 1 : Ghi log ra file (signaling_log.txt) và hiển thị trên màn hình
;   all = 2 : Chỉ hiển thị log ra màn hình, không ghi vào file
all = 2
checkonline = 1
